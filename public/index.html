  const host = $("#apptList");
  if (!host) return;
  let filtered = dashAppts;
  if (tab === "today") filtered = dashAppts.filter((a) => a.date === today() && a.status !== "cancelled");
  else if (tab === "upcoming") filtered = dashAppts.filter((a) => a.date >= today() && a.status !== "cancelled");
  else if (tab === "cancelled") filtered = dashAppts.filter((a) => a.status === "cancelled");
  host.innerHTML = filtered.length ? filtered.map((a) => `
        <div class="box flex"><div><strong>#${esc(a.tokenNumber)} · ${esc(a.patientName)}</strong>
          <p class="muted">${esc(a.date)} at ${esc(a.slotTime)}${a.patientPhone ? " · " + esc(a.patientPhone) : ""}</p></div>
          <span class="badge ${a.status === "cancelled" ? "off" : "ok"}">${esc(a.status)}</span></div>`).join("")
    : `<p class="muted">No appointments in this view.</p>`;
}

/* ---------- 11. ADMIN ---------- */
let adminTab = "pending";

let adminList = []; // the current tab's doctors, kept around so the search box can filter client-side

function renderAdminCards(list, tab) {
  return list.length ? list.map((d) => `
          <div class="box">
            <div class="flex" style="align-items:flex-start">
              <div class="gap">${avatarHtml(d, 44)}
                <div><strong>${esc(d.name)}</strong><p class="muted">${esc(d.department)} · ${esc(d.city)}</p>
                  <p class="muted">${esc(d.email)}</p></div></div>
              ${tab === "pending" ? `<span class="gap">
                  <button class="red sm" data-act="decide" data-do="reject" data-id="${esc(d.id)}">Reject</button>
                  <button class="green sm" data-act="decide" data-do="approve" data-id="${esc(d.id)}">Approve</button>
                </span>` : ""}
            </div>
            ${d.bio ? `<p style="font-size:13.5px;margin-top:10px;color:var(--ink-soft)">${esc(d.bio)}</p>` : ""}
            <p class="muted" style="margin-top:8px">${d.clinic ? esc(d.clinic.name) + " — " + esc(d.clinic.address) : "No clinic added yet"}
              · Daily limit: ${d.maxDailyAppointments == null ? "unlimited" : esc(d.maxDailyAppointments)}</p>
          </div>`).join("")
    : `<div class="empty-state"><svg><use href="#i-shield"/></svg><h3>Nothing here</h3><p>No doctors in this category right now.</p></div>`;
}

// A tiny, dependency-free CSV writer. Good enough for "export what's on screen
// right now" — it isn't meant to replace a real reporting pipeline.
function toCsv(rows, columns) {
  const escapeCell = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const header = columns.map((c) => escapeCell(c.label)).join(",");
  const body = rows.map((r) => columns.map((c) => escapeCell(c.get(r))).join(",")).join("\n");
  return header + "\n" + body;
}
function downloadCsv(filename, csv) {
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename; link.click();
  URL.revokeObjectURL(url);
}
function exportAdminCsv() {
  const csv = toCsv(adminList, [
    { label: "Name", get: (d) => d.name }, { label: "Email", get: (d) => d.email },
    { label: "Department", get: (d) => d.department }, { label: "City", get: (d) => d.city },
    { label: "Experience (yrs)", get: (d) => d.experienceYears }, { label: "Status", get: (d) => d.status },
    { label: "Clinic", get: (d) => d.clinic?.name || "" }, { label: "Clinic address", get: (d) => d.clinic?.address || "" },
    { label: "Daily limit", get: (d) => d.maxDailyAppointments ?? "unlimited" }
  ]);
  downloadCsv(`docsearch-${adminTab}-doctors.csv`, csv);
}

function filterAdminList(query) {
  const q = query.trim().toLowerCase();
  const filtered = q ? adminList.filter((d) => d.name.toLowerCase().includes(q) || d.email.toLowerCase().includes(q) || d.department.toLowerCase().includes(q)) : adminList;
  $("#adminCards").innerHTML = renderAdminCards(filtered, adminTab);
}

async function openAdmin(tab = adminTab) {
  adminTab = tab;
  try {
    // The three status counts are fetched together so the tab bar can show
    // "Pending (4)" instead of leaving the admin to click through each tab
    // just to see how much work is waiting.
    const statuses = ["pending", "approved", "rejected"];
    const results = await Promise.all(statuses.map((s) => api(`/admin/doctors?status=${s}`, { tokenKey: ADMIN_TOKEN }).catch(() => [])));
    const byStatus = Object.fromEntries(statuses.map((s, i) => [s, results[i]]));
    const counts = Object.fromEntries(statuses.map((s) => [s, byStatus[s].length]));
    adminList = byStatus[tab];

    openScreen(`
      <div class="screen-head">
        <h1 class="display" style="font-size:22px">Admin dashboard</h1>
        <span class="gap"><button data-act="closeScreen">← Map</button><button class="dark" data-act="adminLogout"><svg><use href="#i-logout"/></svg>Log out</button></span>
      </div>
      <div class="tabs" style="margin-top:18px">
        ${["pending", "approved", "rejected"].map((t) =>
          `<button class="tab ${t === tab ? "on" : ""}" data-act="adminTab" data-tab="${t}">${t[0].toUpperCase() + t.slice(1)} <span class="faint">(${counts[t]})</span></button>`).join("")}
      </div>
      <div class="flex" style="gap:8px">
        <div class="search-field" style="margin-bottom:14px;flex:1">
          <svg><use href="#i-search"/></svg>
          <input id="adminSearch" placeholder="Filter by name, email or department" style="padding-right:12px">
        </div>
        <button class="sm" type="button" data-act="exportAdminCsv" data-tip="Download this tab as a spreadsheet">
          <svg><use href="#i-download"/></svg>Export CSV</button>
      </div>
      <div class="stack" id="adminCards">${renderAdminCards(adminList, tab)}</div>`);
    $("#adminSearch").addEventListener("input", debounce((e) => filterAdminList(e.target.value), 120));
  } catch (e) {
    if (e.status === 401) { localStorage.removeItem(ADMIN_TOKEN); closeScreen(); showAdminLogin("Please log in again."); }
    else toast(e.message, "error");
  }
}
</script>
<script>
/* ---------- CONNECTIVITY ---------- */
// A thin banner beats a page full of silently-failed fetches: people can see at a
// glance why a search or a booking just stopped working.
function updateConnBanner() { $("#connBanner").classList.toggle("show", !navigator.onLine); }
window.addEventListener("online", () => { updateConnBanner(); toast("Back online.", "success"); });
window.addEventListener("offline", updateConnBanner);

/* ---------- THEME ---------- */
function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  $("#themeIcon").setAttribute("href", mode === "dark" ? "#i-sun" : "#i-moon");
  localStorage.setItem(THEME_KEY, mode);
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved || system);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}

/* ---------- SIDEBAR (mobile bottom-sheet) ---------- */
function toggleSidebar() {
  if (window.innerWidth > 880) return; // sidebar is always open on desktop
  $("#sidebar").classList.toggle("open");
}
function updateSidebarToggleLabel() {
  const n = doctors.length;
  $("#sidebarToggleLabel").textContent = n ? `List (${n})` : "List";
  $("#sidebarToggle").classList.toggle("hidden", window.innerWidth > 880);
}
window.addEventListener("resize", debounce(updateSidebarToggleLabel, 150));

/* ---------- 12. EVENT WIRING ---------- */
// Buttons carry data-act="name"; this table says what each name does.
const actions = {
  closeModal, closeScreen,
  book: (el) => openBooking(el.dataset.id),
  pdf: () => lastTicket && makePdf(lastTicket),
  ics: () => lastTicket && makeIcs(lastTicket),
  printTicket: () => window.print(),
  copyClinicAddress: async (el) => {
    try { await navigator.clipboard.writeText(el.dataset.value); toast("Address copied.", "success"); }
    catch { toast("Couldn't copy — your browser may be blocking clipboard access.", "error"); }
  },
  copyBookingId: async (el) => {
    try { await navigator.clipboard.writeText(el.dataset.id); toast("Booking ID copied.", "success"); }
    catch { toast("Couldn't copy — your browser may be blocking clipboard access.", "error"); }
  },
  resultCard: (el) => { activeDoctorId = el.dataset.id; highlightCard(el.dataset.id); renderMarkers(); showDoctor(el.dataset.id);
    const d = doctors.find((x) => x.id === el.dataset.id); if (d) map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 14)); },
  patientHub: () => openPatientHub("login"),
  patientTab: (el) => openPatientHub(el.dataset.tab),
  patientLookup: () => openPatientLookup(),
  patientLogout: () => { localStorage.removeItem(PATIENT_TOKEN); localStorage.removeItem("ds_patient_appointments"); closeModal(); syncSession(); toast("Signed out."); },
  doctorHub: () => openDoctorHub("login"),
  doctorTab: (el) => openDoctorHub(el.dataset.tab),
  adminHub: () => openAdminHub(),
  geocodeAddress: (el) => handleAddressGeocode(el.dataset.target),
  downloadSavedPdf: (el) => downloadSavedAppointmentPdf(el.dataset.id),
  logout: () => { localStorage.removeItem(DOCTOR_TOKEN); closeScreen(); syncSession(); toast("Signed out."); },
  adminLogout: () => { localStorage.removeItem(ADMIN_TOKEN); closeScreen(); syncSession(); toast("Signed out."); },
  addRow: () => { $("#rows").insertAdjacentHTML("beforeend", scheduleRow()); profileDirty = true; },
  removeRow: (el) => { el.closest(".srow").remove(); profileDirty = true; },
  adminTab: (el) => openAdmin(el.dataset.tab),
  exportAdminCsv: () => exportAdminCsv(),
  apptTab: (el) => { $$(".tab", el.closest(".tabs")).forEach((t) => t.classList.toggle("on", t === el)); renderApptList(el.dataset.tab); },
  useLocation: (el) => handleUseLocation(el.dataset.target),
  toggleSidebar,
  toggleAvailChip: (el) => { availOnly = !availOnly; el.classList.toggle("on", availOnly); reRunFilters(); },
  toggleSavedChip: (el) => { savedOnly = !savedOnly; el.classList.toggle("on", savedOnly); reRunFilters(); },
  clearFilters: () => {
    availOnly = false; savedOnly = false;
    $("#deptFilter").value = ""; if ($("#sortBy")) $("#sortBy").value = "recommended";
    $("#availChip").classList.remove("on"); $("#savedChip").classList.remove("on");
    reRunFilters();
  },
  toggleFavorite: (el) => {
    const nowOn = toggleFavorite({ id: el.dataset.id, name: el.dataset.name, department: el.dataset.department });
    $$(`[data-act="toggleFavorite"][data-id="${el.dataset.id}"]`).forEach((btn) => {
      btn.setAttribute("aria-pressed", nowOn);
      btn.style.color = nowOn ? "var(--warn)" : "";
      btn.style.borderColor = nowOn ? "var(--warn-soft)" : "";
      btn.style.background = nowOn ? "var(--warn-soft)" : "";
      btn.querySelector("svg").setAttribute("fill", nowOn ? "currentColor" : "none");
    });
    if (savedOnly) reRunFilters();
  },
  shortcuts: () => openShortcutsHelp(),
  shareDoctor: async (el) => {
    const url = `${location.origin}${location.pathname}?doctor=${encodeURIComponent(el.dataset.id)}`;
    try { await navigator.clipboard.writeText(url); toast("Link copied to clipboard.", "success"); }
    catch { toast(url); }
  },
  // Reuses the same public doctor-profile popup patients see, fed from `me` directly
  // rather than the public /doctors/:id endpoint — so pending/rejected doctors can
  // still preview their own listing even before (or without) admin approval.
  previewProfile: () => {
    const existed = doctors.some((d) => d.id === me.id);
    if (!existed) doctors.push(me);
    showDoctor(me.id);
    if (!existed) doctors = doctors.filter((d) => d.id !== me.id);
  },
  toggleAvail: async () => {
    try { me = await api("/me", { method: "PATCH", body: { isAvailable: !me.isAvailable }, tokenKey: DOCTOR_TOKEN }); openDashboard(); toast("Availability updated.", "success"); }
    catch (e) { toast(e.message, "error"); }
  },
  decide: async (el) => {
    try { await api(`/admin/doctors/${el.dataset.id}/${el.dataset.do}`, { method: "PATCH", tokenKey: ADMIN_TOKEN }); openAdmin();
      toast(el.dataset.do === "approve" ? "Doctor approved." : "Doctor rejected.", "success"); }
    catch (e) { toast(e.message, "error"); }
  }
};

document.addEventListener("click", (e) => {
  if (e.target.id === "modal") return closeModal(); // click on the dark backdrop
  if (e.target.closest("#sidebarHead") && !e.target.closest("button, input, select, a")) return toggleSidebar();
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});
$("#themeToggle").addEventListener("click", (e) => { e.stopPropagation(); toggleTheme(); });

// Native <button>/<a> elements activate on Enter/Space automatically; a plain
// <div role="button"> (the result cards) does not, so that has to be wired up
// by hand for keyboard users.
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][tabindex]')) {
    e.preventDefault(); e.target.click();
  }
});

document.addEventListener("keydown", (e) => {
  const typing = document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "SELECT";
  if (e.key === "Escape") { if (!$("#modal").classList.contains("hidden")) closeModal(); }
  if (e.key === "/" && !typing) { e.preventDefault(); $("#cityInput").focus(); }
  if (e.key === "?" && !typing) { e.preventDefault(); openShortcutsHelp(); }
  if (e.key.toLowerCase() === "d" && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleTheme(); }
});

function openShortcutsHelp() {
  const rows = [
    ["/", "Focus the city search"], ["Esc", "Close the open dialog"],
    ["d", "Toggle dark mode"], ["Tab / Shift+Tab", "Move through a dialog's fields"], ["?", "Show this list"]
  ];
  openModal(`
    <h2>Keyboard shortcuts</h2>
    <div class="stack" style="margin-top:12px">
      ${rows.map(([key, desc]) => `
        <div class="flex"><span class="muted">${esc(desc)}</span>
          <kbd style="font:600 12px var(--font-body);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px">${esc(key)}</kbd></div>`).join("")}
    </div>
    <div class="actions"><button class="primary" type="button" data-act="closeModal">Got it</button></div>`);
}

// A quick, dependency-free heuristic: length plus variety of character classes.
// It's only meant to nudge people away from very weak passwords, not to replace
// server-side validation.
function passwordStrength(pw) {
  if (!pw) return { score: 0, label: "" };
  let score = Math.min(pw.length / 14, 1) * 2;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score += 0.6;
  if (/\d/.test(pw)) score += 0.5;
  if (/[^a-zA-Z0-9]/.test(pw)) score += 0.7;
  score = Math.min(score, 4);
  const labels = ["Too short", "Weak", "Okay", "Good", "Strong"];
  const colors = ["var(--danger)", "var(--danger)", "var(--warn)", "var(--accent)", "var(--accent)"];
  const idx = Math.max(0, Math.min(4, Math.round(score)));
  return { score, pct: Math.max(8, (idx / 4) * 100), label: pw.length < 6 ? "Too short — needs 6+ characters" : labels[idx], color: colors[idx] };
}

document.addEventListener("input", (e) => {
  if (!e.target.classList.contains("pw-field")) return;
  const wrap = e.target.closest("form");
  const meter = wrap.querySelector(".pw-meter span");
  const label = wrap.querySelector(".pw-meter-label");
  const { pct, label: text, color } = passwordStrength(e.target.value);
  meter.style.width = pct + "%";
  meter.style.background = color || "var(--surface-3)";
  label.textContent = e.target.value ? text : "";
});

document.addEventListener("input", (e) => {
  if (e.target.closest('form[data-form="profile"]')) profileDirty = true;
});

document.addEventListener("change", (e) => {
  if (e.target.closest('form[data-form="profile"]')) profileDirty = true;
  if (e.target.id === "bkDate") {
    const form = e.target.closest("form");
    if (e.target.value) loadAvailability(form.dataset.id, e.target.value);
    return;
  }
  if (e.target.id === "regPicInput") return handlePhotoPick("reg", e.target.files[0]);
  if (e.target.id === "profPicInput") return handlePhotoPick("prof", e.target.files[0]);
  if (e.target.id === "deptFilter" || e.target.id === "sortBy") return reRunFilters();
});

// Every <form data-form="name"> is handled here.
const forms = {
  async search(form) {
    const msg = $("#searchMsg"), btn = $("#searchBtn");
    msg.textContent = ""; btn.disabled = true; btn.textContent = "…";
    try {
      await searchCity(formData(form).city);
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false; btn.textContent = "Search";
  },

  async book(form) {
    const err = $("#bkErr"), btn = $("#bkSubmit");
    err.textContent = "";
    if (!form.elements.slotTime.value) { err.textContent = "Please pick a date and a time slot."; return; }
    btn.disabled = true;
    try {
      const tokenKey = localStorage.getItem(PATIENT_TOKEN) ? PATIENT_TOKEN : undefined;
      const appt = await api("/appointments", { method: "POST", tokenKey, body: { doctorId: form.dataset.id, ...formData(form) } });
      const saved = JSON.parse(localStorage.getItem("ds_patient_appointments") || "[]");
      saved.unshift(appt);
      localStorage.setItem("ds_patient_appointments", JSON.stringify(saved.slice(0, 50)));
      showTicket(appt);
      makePdf(appt); // auto-download the PDF ticket
    } catch (e) {
      err.textContent = e.message; btn.disabled = false;
      loadAvailability(form.dataset.id, form.elements.date.value); // refresh so the screen shows the real situation
    }
  },

  async lookupBookings(form) { lookupBookings(form); },

  async patientLogin(form) {
    const err = form.querySelector(".err"); err.textContent = "";
    try {
      const { token } = await api("/patient/login", { method: "POST", body: formData(form) });
      localStorage.setItem(PATIENT_TOKEN, token);
      syncSession();
      openPatientHub("login");
      toast("Welcome back!", "success");
    } catch (e) { err.textContent = e.message; }
  },

  async patientRegister(form) {
    const err = form.querySelector(".err"); err.textContent = "";
    try {
      const { token } = await api("/patient/register", { method: "POST", body: formData(form) });
      localStorage.setItem(PATIENT_TOKEN, token);
      syncSession();
      openPatientHub("login");
      toast("Account created.", "success");
    } catch (e) { err.textContent = e.message; }
  },

  async login(form) {
    try {
      const { token } = await api("/auth/login", { method: "POST", body: formData(form) });
      localStorage.setItem(DOCTOR_TOKEN, token);
      syncSession();
      closeModal(); openDashboard();
    } catch (e) { form.querySelector(".err").textContent = e.message; }
  },

  async register(form) {
    const err = form.querySelector(".err"); err.textContent = "";
    try {
      const data = formData(form);
      const { lat, lng } = locationOverride.reg || (await geocode(data.city));
      const { token } = await api("/auth/register", {
        method: "POST", body: { ...data, lat, lng, profilePic: photoOverride.reg || undefined }
      });
      localStorage.setItem(DOCTOR_TOKEN, token);
      syncSession();
      closeModal(); openDashboard();
    } catch (e) { err.textContent = e.message; }
  },

  async profile(form) {
    const msg = $("#profMsg"); msg.className = "err"; msg.textContent = "";
    try {
      const body = { ...formData(form), schedule: readSchedule() };
      if (photoOverride.prof) body.profilePic = photoOverride.prof;
      if (locationOverride.prof) { body.lat = locationOverride.prof.lat; body.lng = locationOverride.prof.lng; }
      me = await api("/me", { method: "PATCH", tokenKey: DOCTOR_TOKEN, body });
      delete photoOverride.prof; delete locationOverride.prof;
      profileDirty = false;
      msg.className = "ok-text"; msg.textContent = "Saved!";
      toast("Profile saved.", "success");
    } catch (e) { msg.textContent = e.message; }
  },

  async adminLogin(form) {
    try {
      const { token } = await api("/admin/login", { method: "POST", body: formData(form) });
      localStorage.setItem(ADMIN_TOKEN, token);
      syncSession();
      closeModal(); openAdmin("pending");
    } catch (e) { form.querySelector(".err").textContent = e.message; }
  }
};

document.addEventListener("submit", (e) => {
  const handler = forms[e.target.dataset.form];
  if (handler) { e.preventDefault(); handler(e.target); }
});

// The native 'invalid' event doesn't bubble, so it has to be caught in the
// capture phase; a quick shake on the offending field is a clearer signal
// than the browser's default callout bubble, especially inside a scrolling modal.
document.addEventListener("invalid", (e) => {
  const el = e.target;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  el.addEventListener("animationend", () => el.classList.remove("shake"), { once: true });
}, true);

/* ---------- 13. INIT ---------- */
initTheme();
syncSession();
updateSidebarToggleLabel();
updateConnBanner();

// A shared "Copy link" from a doctor's profile points back here with ?doctor=<id>;
// open that profile straight away so the link is actually useful to receive.
(async function openSharedDoctorIfLinked() {
  const id = new URLSearchParams(location.search).get("doctor");
  if (!id) return;
  try {
    const d = await api(`/doctors/${id}`);
    map.setView([d.lat, d.lng], 14);
    activeDoctorId = d.id;
    showDoctor(d.id);
  } catch { /* stale or invalid link — fail quietly, the map still loads normally */ }
})();
</script>
